<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    openschooldesk favicon — Hexagon-Markenzeichen.
    S-Kurve ist punkt-symmetrisch um Mittelpunkt (16,16).
    Beide Bezier-Bögen sind gespiegelte Hälften.
  -->

  <!-- Flat-top Hexagon, Logo-Blau -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#2563EB"/>

  <!--
    S: Zwei gespiegelte Kubische Bézierkurven.
    Oberer Bogen: (21.5,11.5) → (10.5,16)  mit Kontrollpunkten oben
    Unterer Bogen: (10.5,16) → (21.5,20.5) mit Kontrollpunkten unten
    Beide Bögen sind 180°-Rotation voneinander — exakt symmetrisch.
  -->
  <path
    d="M 21.5 11.5
       C 21.5 7,  10.5 7,  10.5 16
       C 10.5 25, 21.5 25, 21.5 20.5"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
</svg>
