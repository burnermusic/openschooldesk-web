<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    openschooldesk favicon — Hexagon-Ring auf Logo-Blau.
    Bei 16px liest sich der Ring sofort als das Markenzeichen.
    Kein inneres Symbol — zu klein um es zu erkennen.
  -->

  <!-- Blauer Hintergrund (abgerundetes Quadrat) -->
  <rect width="32" height="32" rx="6" fill="#2563EB"/>

  <!-- Weißer Hexagon-Ring -->
  <polygon
    points="16,4.5 26,10.5 26,21.5 16,27.5 6,21.5 6,10.5"
    stroke="white"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
