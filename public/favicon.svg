<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded square background in indigo -->
  <rect width="32" height="32" rx="7" fill="#4F46E5"/>
  <!-- Stylised "o" — two concentric rounded shapes suggesting an open ring / desk portal -->
  <circle cx="16" cy="15" r="7.5" stroke="#fff" stroke-width="3.2" fill="none"/>
  <!-- Small desk-surface bar at the bottom, anchoring the mark -->
  <rect x="9" y="24" width="14" height="2.8" rx="1.4" fill="#fff" opacity="0.85"/>
</svg>
